<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="description" content="Inicio de sesión DermaCheck" />
    <meta name="author" content="DermaCheck" />

    <title>DermaCheck - Iniciar Sesión</title>

    <!-- Icon Font Stylesheet -->
    <link 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" 
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" 
        rel="stylesheet"
    >

    <!-- Hojas de estilo del sitio DermaCheck -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>

        html,
        body {
            height: 100%;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #6d1537;
            padding: 2rem 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 1rem 3rem rgb(245, 139, 222);
        }

        .login-card .card-header {
            background-color: #ee4586;
            border-bottom: none;
            padding-top: 2.5rem;
        }

        .login-logo {
            max-width: 200px;
            width: 100%;
            height: auto;
            margin: 0 auto 0.5rem auto;
            display: block;
        }

        /* Ícono de respaldo */
        .login-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #ff00fb;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
        }

        .login-icon i {
            color: hsl(303, 79%, 77%);
            font-size: 1.75rem;
        }

        .login-card .card-body {
            padding: 1rem 2.5rem 2rem 2.5rem;
        }

        .login-card .card-footer {
            background-color: #f5b5ea;
            border-top: 1px solid #050505;
        }

        .btn-login {
            border-radius: 50px;
            padding: 0.6rem 0;
            font-weight: 600;
        }

        .form-control {
            border-radius: 0.6rem;
        }

        /* Mensaje de error */
        .error-message {
            display: none;
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
        }

        /* Borde rojo cuando hay error */
        .input-error {
            border: 2px solid #dc3545 !important;
        }

        /* Borde verde cuando es válido */
        .input-valid {
            border: 2px solid #198754 !important;
        }

    </style>

</head>


<body>

    <div class="login-page">

        <div class="card login-card">

            <!-- ENCABEZADO -->
            <div class="card-header text-center border-0">

                <!-- Logo -->
                <img 
                    src="imagenes/Logo.png" 
                    alt="Logo DermaCheck" 
                    class="login-logo"
                    onerror="
                        this.remove(); 
                        document.getElementById('loginIconFallback').style.display='flex';
                    "
                />

                <!-- Ícono de respaldo -->
                <div 
                    class="login-icon" 
                    id="loginIconFallback" 
                    style="display:none;"
                >
                    <i class="fa fa-user-md"></i>
                </div>

                <p class="text-muted small mb-0">
                    Tu dermatólogo virtual
                </p>

            </div>


            <!-- CUERPO DEL LOGIN -->
            <div class="card-body">

                <form id="loginForm">

                    <!-- CORREO -->
                    <div class="form-floating mb-3">

                        <input 
                            class="form-control" 
                            id="inputEmail" 
                            type="email" 
                            placeholder="name@example.com"
                            autocomplete="email"
                        />

                        <label for="inputEmail">
                            Dirección de correo
                        </label>

                        <div id="emailError" class="error-message">
                            Por favor, ingresa un correo válido que contenga @.
                        </div>

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="form-floating mb-3">

                        <input 
                            class="form-control" 
                            id="inputPassword" 
                            type="password" 
                            placeholder="Contraseña"
                            autocomplete="current-password"
                        />

                        <label for="inputPassword">
                            Contraseña
                        </label>

                        <div id="passwordError" class="error-message">
                            Por favor, ingresa tu contraseña.
                        </div>

                    </div>


                    <!-- RECORDAR CONTRASEÑA -->
                    <div class="form-check mb-3">

                        <input 
                            class="form-check-input" 
                            id="inputRememberPassword" 
                            type="checkbox"
                        />

                        <label 
                            class="form-check-label" 
                            for="inputRememberPassword"
                        >
                            Recordarme
                        </label>

                    </div>


                    <!-- BOTÓN INICIAR SESIÓN -->
                    <div class="d-grid mb-3">

                        <button 
                            type="submit" 
                            class="btn btn-primary btn-login"
                        >
                            Iniciar sesión
                        </button>

                    </div>


                    <!-- RECUPERAR CONTRASEÑA -->
                    <div class="text-center">

                        <a 
                            class="small text-decoration-none" 
                            href="password.html"
                        >
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>

                </form>

            </div>


            <!-- PIE DEL LOGIN -->
            <div class="card-footer text-center py-3">

                <div class="small">

                    ¿Usuario nuevo?

                    <a 
                        href="register.html" 
                        class="fw-semibold text-decoration-none"
                    >
                        Regístrate
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous">
    </script>


    <!-- VALIDACIÓN DEL LOGIN -->
    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                // Evita que el formulario se envíe automáticamente
                event.preventDefault();


                // Obtener los valores
                const email = document
                    .getElementById("inputEmail")
                    .value
                    .trim();

                const password = document
                    .getElementById("inputPassword")
                    .value
                    .trim();


                // Elementos de mensajes
                const emailError = document.getElementById("emailError");
                const passwordError = document.getElementById("passwordError");


                // Ocultar mensajes anteriores
                emailError.style.display = "none";
                passwordError.style.display = "none";


                // Quitar estilos anteriores
                document
                    .getElementById("inputEmail")
                    .classList.remove("input-error", "input-valid");

                document
                    .getElementById("inputPassword")
                    .classList.remove("input-error", "input-valid");


                /* ==========================
                   VALIDAR CORREO
                   ========================== */

                if (email === "") {

                    emailError.textContent =
                        "Por favor, ingresa tu correo electrónico.";

                    emailError.style.display = "block";

                    document
                        .getElementById("inputEmail")
                        .classList.add("input-error");

                    document
                        .getElementById("inputEmail")
                        .focus();

                    return;
                }


                // Verificar que tenga @
                if (!email.includes("@")) {

                    emailError.textContent =
                        "El correo debe contener el símbolo @.";

                    emailError.style.display = "block";

                    document
                        .getElementById("inputEmail")
                        .classList.add("input-error");

                    document
                        .getElementById("inputEmail")
                        .focus();

                    return;
                }


                // Validar estructura del correo
                const emailRegex =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailRegex.test(email)) {

                    emailError.textContent =
                        "Por favor, ingresa un correo válido. Ejemplo: usuario@gmail.com";

                    emailError.style.display = "block";

                    document
                        .getElementById("inputEmail")
                        .classList.add("input-error");

                    document
                        .getElementById("inputEmail")
                        .focus();

                    return;
                }


                // Correo correcto
                document
                    .getElementById("inputEmail")
                    .classList.add("input-valid");


                /* ==========================
                   VALIDAR CONTRASEÑA
                   ========================== */

                if (password === "") {

                    passwordError.style.display = "block";

                    document
                        .getElementById("inputPassword")
                        .classList.add("input-error");

                    document
                        .getElementById("inputPassword")
                        .focus();

                    return;
                }


                // Contraseña correcta
                document
                    .getElementById("inputPassword")
                    .classList.add("input-valid");

                window.location.href = "index.html";

            });

    </script>

</body>

</html>
